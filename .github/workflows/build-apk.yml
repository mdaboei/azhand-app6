name: Build Android APK (آژند اپ)

# هر بار که کد push شود یا دستی اجرا کنی، APK می‌سازد
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: استخراج سورس از ajand-source.zip
        run: |
          # کل سورس (package.json، src، android، ...) داخل ajand-source.zip است —
          # این مرحله آن را در ریشهٔ ریپو باز می‌کند تا npm و gradle کار کنند.
          if [ -f ajand-source.zip ]; then
            unzip -qo ajand-source.zip -d .
            if [ ! -f package.json ]; then
              echo "::error::داخل ajand-source.zip فایل package.json پیدا نشد"
              exit 1
            fi
            echo "✓ سورس استخراج شد — package.json آماده است"
          else
            echo "ajand-source.zip نیست — فرض: سورس مستقیم در ریپو آپلود شده است"
          fi

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: نصب پکیج‌ها
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: آماده‌سازی Android SDK
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          # پذیرش لایسنس‌ها
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true

          # نصب پلتفرم ۳۶ و ابزار بیلد — تا ۵ بار تلاش مجدد در صورت خطای موقت
          ok=0
          for i in 1 2 3 4 5; do
            if "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;36.0.0"; then
              ok=1
              break
            fi
            echo "تلاش $i ناموفق بود، ۱۵ ثانیه صبر می‌کنیم..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::نصب SDK بعد از ۵ تلاش ناموفق بود"
            exit 1
          fi

      - name: بازسازی فایل‌های تولیدی Capacitor
        run: |
          # این دستور همه فایل‌های تولیدشده را از نو می‌سازد:
          # assets (صفحه اول اپ)، capacitor.config.json و ماژول پلاگین‌ها
          npx cap sync android

          # config.xml فقط هنگام cap add ساخته می‌شود؛ اگر نبود، همین‌جا می‌سازیم
          if [ ! -f android/app/src/main/res/xml/config.xml ]; then
            mkdir -p android/app/src/main/res/xml
            printf '%s\n' \
              "<?xml version='1.0' encoding='utf-8'?>" \
              '<widget version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">' \
              '  <access origin="*" />' \
              '</widget>' > android/app/src/main/res/xml/config.xml
            echo "config.xml ساخته شد"
          fi

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: آماده‌سازی خروجی APK
        uses: actions/upload-artifact@v4
        with:
          name: ajand-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
